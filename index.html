<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta property="og:description" content="スマホ1台で、モルックのみんなの点数をかんたん記録。こえたら25点にもどる計算や、0点がつづいた回数も自動でけいさんします。">

<style>
  /* モルックの木のピン（スキットル）をイメージした配色。docs/design-mockup.html と同じ値。
     コントラスト比は背景 --bg に対する値。暗い色・ダークモードは使わない。 */
  :root {
    --bg: #FFF8EE;            /* 白木（バーチ材）のクリーム */
    --surface: #FBEBD3;       /* 明るい木のカード */
    --line: #E6CCA6;          /* 木目の線 */
    --text: #4A2F1B;          /* こげ茶（本文） 11.6:1 */
    --text-sub: #7A5537;      /* 茶（補足） 6.3:1 */
    --accent: #B84E0B;        /* 焼きオレンジ（主ボタン。白文字で 5.1:1） */
    --accent-text: #FFFFFF;
    --accent-soft: #FFE2B3;   /* 手番の行・お知らせ帯 */
    --accent-line: #F59A3C;   /* 手番の枠・強調線 */
    --pin: #F3D9B1;           /* 数字ボタン（木のピン） */
    --pin-edge: #C9A272;
    --miss: #A8510A;          /* 0点の印 5.2:1 */
    --fault: #9A3B26;         /* フォルト 6.6:1 */
    --out: #74665A;           /* おしまい */
    --win: #3D7A34;           /* ゴール 4.9:1 */
    --gold: #E0A100;
    --radius: 14px;
    --gap: 8px;
    --tap: 56px;              /* ボタンの最小サイズ */
    --font: system-ui, -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-num: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { margin: 0; height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;          /* ダブルタップ拡大を無効化 */
    -webkit-tap-highlight-color: transparent;
  }

  button, input, select { font: inherit; color: inherit; }

  button {
    min-height: var(--tap);
    min-width: var(--tap);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 800; font-size: 20px; box-shadow: 0 4px 0 #8A3A08; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .screen {
    display: none;
    flex-direction: column;
    min-height: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    gap: 16px;
  }
  .screen.is-active { display: flex; }

  h1 { font-size: 24px; margin: 0; line-height: 1.2; }
  h2 { font-size: 17px; margin: 0 0 4px; }

  .panel {
    background: #FFFFFF;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ===== 準備画面 ===== */
  .app-head {
    display: flex; align-items: center; gap: 12px;
    margin: -16px -16px 0; padding: 14px 16px 12px;
    background:
      repeating-linear-gradient(100deg, rgba(201,162,114,.12) 0 6px, transparent 6px 14px),
      var(--surface);
    border-bottom: 2px solid var(--line);
  }
  .app-head .sub { margin: 2px 0 0; font-size: 13px; color: var(--text-sub); }
  .app-logo { flex: none; display: block; filter: drop-shadow(0 2px 3px rgba(180, 83, 12, .25)); }

  .field {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 6px 12px; padding: 8px 0;
  }
  .field + .field { border-top: 1px dashed var(--line); }
  /* 狭い画面では、ことばの途中ではなく空白のところで改行する */
  .field-label { flex: 1 1 7.5em; word-break: keep-all; overflow-wrap: anywhere; }
  .field-ctrl { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .unit { font-weight: 700; }

  .num {
    width: 4.4em; min-height: 48px; text-align: center;
    font-family: var(--font-num); font-size: 22px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  .num:disabled { opacity: .45; }
  .num.small { width: 3.2em; }

  .seg { display: inline-flex; border: 2px solid var(--accent); border-radius: 999px; overflow: hidden; }
  .seg button {
    min-height: 44px; min-width: 0; border: 0; border-radius: 0; background: #FFFFFF;
    padding: 0 12px; font-size: 14px; font-weight: 700;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

  /* オン／オフのスイッチ（button role="switch"） */
  button.switch {
    position: relative; flex: none;
    width: 60px; min-width: 60px; height: 36px; min-height: 36px;
    border: 0; border-radius: 999px; background: #D9C6AE; padding: 0;
  }
  button.switch::after {
    content: ""; position: absolute; top: 4px; left: 4px;
    width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF;
    transition: transform .15s;
  }
  button.switch[aria-checked="true"] { background: var(--accent); }
  button.switch[aria-checked="true"]::after { transform: translateX(24px); }

  .summary {
    margin: 8px 0 0; padding: 8px 10px; border-radius: 10px;
    background: var(--accent-soft); font-size: 14px; font-weight: 700;
  }
  button.link-btn {
    display: block; margin: 4px 0 0 auto; min-height: 44px; min-width: 0;
    border: 0; background: none; padding: 0 4px;
    color: var(--accent); font-size: 14px; font-weight: 700;
    text-decoration: underline; text-underline-offset: 3px;
  }

  .players { list-style: none; margin: 0; padding: 0; }
  .player { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
  .player + .player { border-top: 1px dashed var(--line); }
  .badge {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-line); font-weight: 800; font-size: 14px;
    display: grid; place-items: center;
  }
  .name-input {
    flex: 1; min-width: 0; min-height: 48px; padding: 6px 10px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px;
  }
  /* 並べかえ・削除は名前欄を広く取るため 44px 高（試合中のボタンは 56px 以上） */
  button.mini {
    flex: none; width: 38px; min-width: 38px; height: 44px; min-height: 44px; padding: 0;
    border-radius: 10px; background: #FFFFFF; color: var(--text-sub); font-size: 14px;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row button { flex: 1; min-height: 48px; font-weight: 700; font-size: 15px; background: #FFFFFF; }

  .errors {
    margin: 0; padding: 8px 12px 8px 28px; border-radius: 10px;
    background: #FFF1EC; border: 2px solid var(--fault); color: var(--fault); font-weight: 700; font-size: 14px;
  }
  .errors:empty { display: none; }

  .site-footer {
    margin-top: auto;
    font-size: 13px;
    color: var(--text-sub);
    text-align: center;
  }
  .site-footer a { color: inherit; }
  .site-footer p { margin: 0 0 4px; }

  /* ===== 試合画面 ===== */
  #screen-game { padding: 0; gap: 0; position: relative; }
  #screen-game.is-active { height: 100vh; height: 100dvh; }

  .turn {
    background: var(--accent-soft); border-bottom: 2px solid var(--accent-line);
    padding: 8px 16px; text-align: center;
  }
  .round {
    display: inline-block; font-size: 13px; font-weight: 700; background: #FFFFFF;
    border: 1px solid var(--accent-line); border-radius: 999px; padding: 0 12px;
  }
  .who { font-size: 24px; font-weight: 800; line-height: 1.3; margin-top: 2px; word-break: break-all; }
  .left { font-size: 15px; }
  .left b { font-family: var(--font-num); font-size: 24px; color: var(--accent); }
  .warn {
    display: inline-block; margin-top: 4px; padding: 2px 12px; border-radius: 999px;
    background: #FFFFFF; border: 2px solid var(--miss); color: var(--miss); font-size: 13px; font-weight: 700;
  }
  .warn[hidden] { display: none; }

  .board {
    flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0;
    padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .p-row {
    display: grid; grid-template-columns: 16px 1fr auto 64px; align-items: center; gap: 8px;
    background: #FFFFFF; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px;
  }
  .p-row.now { background: var(--accent-soft); border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent-line); }
  .p-row .mark { color: var(--accent); font-size: 14px; }
  .p-row .nm { font-weight: 700; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
  .p-row .meta { font-size: 12px; color: var(--text-sub); display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; }
  .dots { color: var(--miss); letter-spacing: 1px; }
  .p-row .score { font-family: var(--font-num); font-size: 32px; font-weight: 800; text-align: right; line-height: 1; }
  .p-row .last { font-size: 12px; text-align: right; color: var(--text-sub); }
  .p-row.out { background: #F4EEE7; border-style: dashed; color: var(--out); }
  .p-row.out .nm { text-decoration: line-through; }
  .tag {
    font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 8px;
    background: #FFFFFF; border: 1px solid var(--out); color: var(--out);
  }

  /* 入力直後に少しだけ、スコアボードの上に重ねて出すお知らせ */
  .toast {
    position: absolute; left: 12px; right: 12px; top: 120px; z-index: 2;
    padding: 10px 12px; border-radius: 12px; text-align: center;
    background: #FFFFFF; border: 2px solid var(--accent-line);
    font-weight: 800; font-size: 17px;
    box-shadow: 0 6px 16px rgba(74,47,27,.2);
    pointer-events: none;
    opacity: 0; transform: translateY(-6px); transition: opacity .15s, transform .15s;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.over { border-color: var(--accent); }
  .toast.miss { border-color: var(--miss); color: var(--miss); }
  .toast.out { border-color: var(--out); color: var(--out); }

  .pad {
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 2px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .pad-q { grid-column: 1 / -1; font-size: 15px; font-weight: 800; margin: -2px 0; }
  .step-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
  button.back {
    min-height: 44px; min-width: 0; padding: 0 12px; border-radius: 999px;
    background: #FFFFFF; font-size: 14px; font-weight: 700;
  }

  /* ステップ1「どうだった？」の4つのボタン */
  button.choice {
    grid-column: span 2; min-height: 72px; min-width: 0;
    border-radius: 14px; border-color: var(--pin-edge); background: #FFFFFF;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px; line-height: 1.2;
  }
  button.choice small { font-size: 12px; font-weight: 700; }
  button.choice.one { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.choice.many { background: #6B4226; border-color: #6B4226; color: #FFFFFF; }
  button.choice.zero { border-color: var(--miss); color: var(--miss); }
  button.choice.fault { border-color: var(--fault); color: var(--fault); }

  /* 1本だけ: ピンの番号（木のピンの形） */
  button.pin {
    min-width: 0; height: 58px; border: 2px solid var(--pin-edge); background: var(--pin);
    font-family: var(--font-num); font-size: 26px; font-weight: 800; padding-top: 6px;
    border-radius: 6px 6px 12px 12px;
    clip-path: polygon(0 18%, 100% 0, 100% 100%, 0 100%);
  }
  button.pin:active { background: var(--accent-line); }
  /* 2本以上: 本数（ピンの形にしない、丸い札＋「本」） */
  button.count {
    min-width: 0; height: 58px; border-radius: 999px; border-color: #6B4226; background: #FFFFFF; color: #6B4226;
    display: flex; align-items: baseline; justify-content: center; gap: 1px; padding-top: 10px; font-weight: 800;
  }
  button.count b { font-family: var(--font-num); font-size: 26px; line-height: 1; }
  button.count small { font-size: 13px; }
  button.count:active { background: #F3E3D3; }

  .tools { grid-column: 1 / -1; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
  .tools button { min-height: 48px; min-width: 0; padding: 0 4px; white-space: nowrap; font-size: 14px; font-weight: 700; background: #FFFFFF; }
  @media (max-width: 359px) {
    .tools button { font-size: 12px; }
  }

  /* ===== 結果画面 ===== */
  .goal { text-align: center; padding-top: 8px; }
  .goal .big { font-size: 36px; font-weight: 900; color: var(--accent); letter-spacing: .05em; line-height: 1.3; }
  .goal .winner { font-size: 26px; font-weight: 800; overflow-wrap: anywhere; }
  .goal .msg { margin: 4px 0 0; color: var(--text-sub); font-size: 15px; }
  .ranking { list-style: none; margin: 0; padding: 0; }
  .rank { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 8px 6px; }
  .rank + .rank { border-top: 1px dashed var(--line); }
  .rank .pos { font-weight: 800; text-align: center; }
  .rank .rn { overflow-wrap: anywhere; }
  .rank .sc { font-family: var(--font-num); font-size: 24px; font-weight: 800; }
  .rank.first { background: var(--accent-soft); border-radius: 10px; }
  .rank.out { color: var(--out); }

  .order-pick { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; font-size: 14px; font-weight: 700; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .result-actions .btn-row { margin-top: 0; }

  /* ===== きろく（公式スコアシート風） ===== */
  dialog.sheet {
    width: min(560px, 100vw); max-width: 100vw; max-height: 100dvh; height: 100dvh;
    margin: 0 auto; padding: 0; border: 0; background: var(--bg); color: var(--text);
  }
  dialog.sheet[open] { display: flex; flex-direction: column; }
  dialog.sheet::backdrop { background: rgba(74, 47, 27, .35); }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; background: var(--surface); border-bottom: 2px solid var(--line);
  }
  .sheet-head h2 { margin: 0; }
  .sheet-head button { min-height: 48px; min-width: 0; padding: 0 16px; font-weight: 700; background: #FFFFFF; }
  .sheet-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .sheet-empty { color: var(--text-sub); text-align: center; margin: 24px 0; }
  table.score-sheet { border-collapse: separate; border-spacing: 0; background: #FFFFFF; font-size: 14px; }
  .score-sheet th, .score-sheet td {
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 4px 6px; text-align: center; min-width: 4.2em;
  }
  .score-sheet thead th {
    position: sticky; top: 0; z-index: 1; background: var(--surface);
    font-size: 13px; max-width: 6em; overflow-wrap: anywhere; line-height: 1.25;
  }
  .score-sheet th[scope="row"], .score-sheet thead th:first-child {
    position: sticky; left: 0; background: var(--surface); min-width: 3.6em; white-space: nowrap; font-family: var(--font-num);
  }
  .score-sheet thead th:first-child { z-index: 2; font-family: var(--font); }
  .score-sheet td .pt { display: block; font-weight: 800; font-family: var(--font-num); }
  .score-sheet td .sum { display: block; font-size: 11px; color: var(--text-sub); }
  .score-sheet td.over { background: #FFF1DE; }
  .score-sheet td.over .pt { color: var(--accent); }
  .score-sheet td.miss .pt { color: var(--miss); }
  .score-sheet td.fault .pt { color: var(--fault); }
  .score-sheet td.out { background: #F4EEE7; }
  .score-sheet td.out .pt { color: var(--out); }
  .score-sheet td.win { background: var(--accent-soft); }
  .score-sheet td.win .pt { color: var(--win); }
  .score-sheet tfoot td { font-weight: 800; background: var(--surface); }
  /* ===== メニュー・確認 ===== */
  dialog.card-dialog {
    width: min(420px, calc(100vw - 32px)); padding: 16px; border: 2px solid var(--line); border-radius: 18px;
    background: var(--bg); color: var(--text); box-shadow: 0 12px 32px rgba(74,47,27,.25);
  }
  dialog.card-dialog::backdrop { background: rgba(74, 47, 27, .35); }
  dialog.card-dialog h2 { margin: 0 0 8px; }
  .menu-rule { margin: 0 0 12px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
  .menu-rule span { display: block; font-size: 12px; color: var(--text-sub); }
  .menu-actions { display: flex; flex-direction: column; gap: 10px; }
  .menu-actions button { min-height: var(--tap); width: 100%; font-weight: 700; font-size: 17px; background: #FFFFFF; }
  .menu-actions button.danger { background: var(--fault); border-color: var(--fault); color: #FFFFFF; }
  .menu-actions button.quiet { background: transparent; }
  .confirm-message { margin: 4px 0 16px; font-size: 17px; font-weight: 700; line-height: 1.6; }
  .confirm-message small { display: block; margin-top: 4px; font-size: 14px; font-weight: 400; color: var(--text-sub); }

  .legend { margin: 10px 0 0; font-size: 13px; color: var(--text-sub); line-height: 1.8; }
  .legend b { font-family: var(--font-num); }
</style>
</head>
<body>

<!-- 準備画面（設計書 4-1） -->
<main id="screen-setup" class="screen is-active" aria-labelledby="setup-title">
  <header class="app-head">
    <img class="app-logo" src="favicon.svg" width="48" height="48" alt="">
    <div>
      <h1 id="setup-title">もるっくん</h1>
      <p class="sub">モルックの点数を、みんなでかんたん記録</p>
    </div>
  </header>

  <section class="panel" aria-labelledby="rules-title">
    <h2 id="rules-title">📏 ルール</h2>

    <div class="field">
      <label class="field-label" for="target">ゴールの点数</label>
      <span class="field-ctrl">
        <input id="target" class="num" autocomplete="off" type="number" inputmode="numeric" min="10" max="200" step="1">
        <span class="unit">点</span>
      </span>
    </div>

    <div class="field">
      <span class="field-label" id="reset-label">こえたら</span>
      <span class="field-ctrl">
        <span class="seg" role="group" aria-labelledby="reset-label">
          <button type="button" data-reset-mode="half">半分（<span id="half-value">25</span>点）</button>
          <button type="button" data-reset-mode="custom">自分で決める</button>
        </span>
      </span>
    </div>
    <div class="field" id="reset-custom-field">
      <label class="field-label" for="reset-value">こえたら もどる点数</label>
      <span class="field-ctrl">
        <input id="reset-value" class="num" autocomplete="off" type="number" inputmode="numeric" min="0" step="1">
        <span class="unit">点</span>
      </span>
    </div>

    <div class="field">
      <span class="field-label" id="miss-label">0点が つづいたら おしまい</span>
      <span class="field-ctrl">
        <input id="miss-limit" class="num small" autocomplete="off" type="number" inputmode="numeric" min="1" max="5" step="1" aria-label="おしまいになる回数">
        <span class="unit">回</span>
        <button type="button" class="switch" id="miss-enabled" role="switch" aria-labelledby="miss-label"></button>
      </span>

<script>
"use strict";

// ==== LOGIC START ====
// 得点計算の純粋関数（設計書 第5章）。画面（DOM）には触れない。
// tests/ からこの区間だけを切り出してテストするため、目印のコメントは消さないこと。
const MolkkyLogic = (() => {
  // 標準ルール: 目標50点・超過で目標の半分（25点）・連続3回ミスで失格・フォルトも連続ミスに数える
  const DEFAULT_SETTINGS = Object.freeze({
    target: 50,
    resetMode: "half",
    resetValue: 25,
    missLimitEnabled: true,
    missLimit: 3,
    faultCountsAsMiss: true,
  });

  const LIMITS = Object.freeze({
    targetMin: 10, targetMax: 200,
    missLimitMin: 1, missLimitMax: 5,
    playersMin: 2, playersMax: 12,
    pointsMax: 12,
  });

  const isInt = (v) => Number.isInteger(v);

  // 超過したときに戻る点数
  function resetPoint(s) {
    return s.resetMode === "half" ? Math.floor(s.target / 2) : s.resetValue;
  }

  // 準備画面の入力チェック。問題がなければ空の配列（画面に出すやさしい言葉で返す）
  function validateSetup(s, playerCount) {
    const errors = [];
    if (!isInt(s.target) || s.target < LIMITS.targetMin || s.target > LIMITS.targetMax) {
      errors.push(`ゴールの点数は ${LIMITS.targetMin}〜${LIMITS.targetMax}点 のあいだで決めてください`);
    }
    if (s.resetMode !== "half" && s.resetMode !== "custom") {
      errors.push("こえたときの点数の決め方をえらんでください");
    } else if (s.resetMode === "custom" && (!isInt(s.resetValue) || s.resetValue < 0 || s.resetValue >= s.target)) {
      errors.push("こえたときにもどる点数は、0点から ゴールの点数より小さい点数 にしてください");
    }
    if (s.missLimitEnabled && (!isInt(s.missLimit) || s.missLimit < LIMITS.missLimitMin || s.missLimit > LIMITS.missLimitMax)) {
      errors.push(`おしまいになる回数は ${LIMITS.missLimitMin}〜${LIMITS.missLimitMax}回 にしてください`);
    }
    if (!isInt(playerCount) || playerCount < LIMITS.playersMin || playerCount > LIMITS.playersMax) {
      errors.push(`あそぶ人は ${LIMITS.playersMin}〜${LIMITS.playersMax}人 にしてください`);
    }
    return errors;
  }

  // 1投を1人の状態 p に当てはめ、判定を返す（p を書き換える）
  //   ADD: 加算 / OVER: 超過して戻り点へ / WIN: 目標点ちょうど
  //   MISS: 0点（連続ミス+1） / OUT: 連続ミスで失格 / FAULT: 連続ミスに数えないフォルト
  function applyThrow(p, t, s) {
    if (t.fault && !s.faultCountsAsMiss) return "FAULT";
    const points = t.fault ? 0 : t.points;
    if (points === 0) {
      p.misses += 1;
      if (s.missLimitEnabled && p.misses >= s.missLimit) {
        p.score = 0; p.out = true; return "OUT";
      }
      return "MISS";
    }
    p.misses = 0;
    const next = p.score + points;
    if (next === s.target) { p.score = next; return "WIN"; }
    if (next > s.target) { p.score = resetPoint(s); return "OVER"; }
    p.score = next;
    return "ADD";
  }

  // 保存データ（settings・players・throws）から、現在の試合の状態をすべて計算し直す。
  // 記録に矛盾（手番違い・終了後の投擲・範囲外の点数）があれば Error を投げる。
  function computeState(game) {
    const s = game.settings;
    const players = game.players.map((pl) => ({
      id: pl.id, name: pl.name, score: 0, misses: 0, out: false,
    }));
    const history = [];
    let turn = 0;          // 次に投げる人の players での位置
    let round = 1;
    let winnerId = null;
    let finished = false;

    const activeCount = () => players.filter((p) => !p.out).length;

    for (const [i, t] of game.throws.entries()) {
      if (finished) throw new Error(`throw #${i}: 試合終了後の投擲です`);
      const p = players[turn];
      if (t.playerId !== p.id) throw new Error(`throw #${i}: 手番は ${p.id} ですが ${t.playerId} の記録です`);
      if (!t.fault && (!isInt(t.points) || t.points < 0 || t.points > LIMITS.pointsMax)) {
        throw new Error(`throw #${i}: 点数 ${t.points} は 0〜${LIMITS.pointsMax} ではありません`);
      }

      const before = p.score;
      const result = applyThrow(p, t, s);
      history.push({
        index: i, round, playerId: p.id,
        points: t.fault ? 0 : t.points, fault: !!t.fault,
        result, before, after: p.score, misses: p.misses,
      });

      if (result === "WIN") {
        finished = true; winnerId = p.id;
      } else if (result === "OUT" && activeCount() <= 1) {
        // 残りが1人ならその人の勝ち（全員失格は1人プレイのときだけ起こりうる）
        finished = true;
        winnerId = activeCount() === 1 ? players.find((q) => !q.out).id : null;
      } else {
        // 次の「失格していない人」へ。先頭を越えたらラウンド+1
        do {
          turn += 1;
          if (turn === players.length) { turn = 0; round += 1; }
        } while (players[turn].out);
      }
    }

    for (const p of players) {
      p.remaining = s.target - p.score;
      // 「つぎ0点だと おしまい」の警告
      p.atRisk = !p.out && s.missLimitEnabled && p.misses === s.missLimit - 1;
    }

    return {
      players,
      history,
      round,
      finished,
      winnerId,
      currentPlayerId: finished ? null : players[turn].id,
      last: history.length ? history[history.length - 1] : null,
    };
  }

  // 結果画面の順位: 勝者 ＞ 残り点の高い順（同点は同じ順位） ＞ 失格者（後まで残った人が上）。失格者の rank は null
  function ranking(state) {
    const outOrder = new Map();
    for (const h of state.history) if (h.result === "OUT") outOrder.set(h.playerId, h.index);
    const winner = state.players.filter((p) => p.id === state.winnerId);
    const alive = state.players
      .filter((p) => p.id !== state.winnerId && !p.out)
      .sort((a, b) => b.score - a.score);
    const out = state.players
      .filter((p) => p.out)
      .sort((a, b) => outOrder.get(b.id) - outOrder.get(a.id));

    const rows = [];
    for (const p of winner) rows.push({ ...p, rank: 1, winner: true });
    for (const [i, p] of alive.entries()) {
      const prev = rows[rows.length - 1];
      const tied = i > 0 && prev.score === p.score;
      rows.push({ ...p, rank: tied ? prev.rank : rows.length + 1, winner: false });
    }
    for (const p of out) rows.push({ ...p, rank: null, winner: false });
    return rows;
  }

  // 再戦の投げる順。"same": そのまま ／ "winnerLast": 前回勝った人を最後にする
  function rematchOrder(players, winnerId, mode) {
    const list = players.slice();
    if (mode === "winnerLast") {
      const i = list.findIndex((p) => p.id === winnerId);
      if (i !== -1) list.push(...list.splice(i, 1));
    }
    return list;
  }

  // ---- 保存データの読み込み（設計書 5-1）。壊れたデータ・形式違いは null を返して捨てる ----
  const VERSION = 1;
  const NAME_MAX = 20;
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

  function cleanSettings(s) {
    if (!isObj(s)) return null;
    const out = {
      target: s.target,
      resetMode: s.resetMode,
      resetValue: s.resetValue,
      missLimitEnabled: s.missLimitEnabled,
      missLimit: s.missLimit,
      faultCountsAsMiss: s.faultCountsAsMiss,
    };
    if (typeof out.missLimitEnabled !== "boolean" || typeof out.faultCountsAsMiss !== "boolean") return null;
    if (out.resetMode === "half") out.resetValue = Math.floor(out.target / 2);
    return settingsOk(out) ? out : null;
  }
  const settingsOk = (s) => validateSetup(s, LIMITS.playersMin).length === 0;

  // 進行中（または終わった直後）の試合
  function restoreGame(data) {
    try {
      if (!isObj(data) || data.version !== VERSION) return null;
      const settings = cleanSettings(data.settings);
      if (!settings) return null;
      const { players, throws } = data;
      if (!Array.isArray(players) || players.length < LIMITS.playersMin || players.length > LIMITS.playersMax) return null;
      const ids = new Set();
      for (const p of players) {
        if (!isObj(p) || typeof p.id !== "string" || typeof p.name !== "string" || ids.has(p.id)) return null;
        ids.add(p.id);
      }
      if (!Array.isArray(throws)) return null;
      for (const t of throws) {
        if (!isObj(t) || typeof t.playerId !== "string" || typeof t.fault !== "boolean") return null;
      }
      const game = {
        version: VERSION,
        settings,
        players: players.map((p) => ({ id: p.id, name: p.name.slice(0, NAME_MAX) })),
        throws: throws.map((t) => ({ playerId: t.playerId, points: t.points, fault: t.fault, at: t.at })),
        startedAt: typeof data.startedAt === "string" ? data.startedAt : null,
      };
      computeState(game);   // 手番違い・範囲外の点数などの矛盾があればここで Error になる
      return game;
    } catch {
      return null;
    }
  }

  // 次回の準備画面の初期値（ルールと名前）。ルールがおかしければ標準ルールにする
  function restoreSetup(data) {
    if (!isObj(data)) return null;
    const settings = cleanSettings(data.settings) || { ...DEFAULT_SETTINGS };
    const names = Array.isArray(data.names)
      ? data.names.filter((n) => typeof n === "string").map((n) => n.slice(0, NAME_MAX)).slice(0, LIMITS.playersMax)
      : [];
    while (names.length < LIMITS.playersMin) names.push("");
    return { settings, names };
  }

  return Object.freeze({
    DEFAULT_SETTINGS, LIMITS, VERSION, resetPoint, validateSetup, applyThrow, computeState, ranking, rematchOrder,
    restoreGame, restoreSetup,
  });
})();
// ==== LOGIC END ====

// ==== 画面 ====
// 画面は computeState の結果だけを見て描き直す。名前などの入力値は textContent で表示する（innerHTML に入れない）。
const L = MolkkyLogic;
const $ = (id) => document.getElementById(id);

// 要素を作る小さな関数。子に文字列を渡すとテキストとして追加される（HTMLとして解釈しない）
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

const SCREENS = ["setup", "game", "result"];

function showScreen(name) {
  if (!SCREENS.includes(name)) throw new Error(`unknown screen: ${name}`);
  for (const s of SCREENS) {
    $(`screen-${s}`).classList.toggle("is-active", s === name);
  }
  window.scrollTo(0, 0);
  keepAwake(name === "game");
}

// ---- 画面の消灯防止（Wake Lock。HTTPS かつ対応ブラウザのみ。非対応なら何もしない） ----
let wakeLock = null;
let wakeWanted = false;

async function keepAwake(on) {
  wakeWanted = on;
  if (!("wakeLock" in navigator)) return;
  try {
    if (on && !wakeLock && document.visibilityState === "visible") {
      const lock = await navigator.wakeLock.request("screen");
      lock.addEventListener("release", () => { if (wakeLock === lock) wakeLock = null; });
      // 待っている間に試合画面を離れていたら、すぐ手放す
      if (wakeWanted) wakeLock = lock; else await lock.release();
    } else if (!on && wakeLock) {
      const lock = wakeLock;
      wakeLock = null;
      await lock.release();
    }
  } catch {
    // 省電力モードなどで断られても、試合はそのまま続ける
  }
}

// 別のアプリから戻ったとき（ブラウザが自動で手放している）に取り直す
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && wakeWanted) keepAwake(true);
});

// ---- 端末への保存（localStorage）。保存できない環境でも試合は続けられる ----
const STORE_GAME = "molkky-score:v1:game";
const STORE_SETUP = "molkky-score:v1:lastSetup";

const store = {
  get(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 保存できなくても続ける */ }
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch { /* 同上 */ }
  },
};

const saveGame = () => { if (app.game) store.set(STORE_GAME, app.game); };
const clearGame = () => store.remove(STORE_GAME);

const app = {
  setup: {
    settings: { ...L.DEFAULT_SETTINGS },
    players: [],             // { key, name }  key は並べかえ用の一時的な番号
  },
  game: null,                // 保存データと同じ形（設計書 5-1）
  padStep: "choose",         // "choose" | "one" | "many"
  toastTimer: 0,
  rematchOrder: "same",      // 再戦の投げる順 "same" | "winnerLast"
};
let playerKey = 0;
const newPlayer = (name = "") => ({ key: ++playerKey, name });
const defaultName = (i) => `プレイヤー${i + 1}`;

// ---- 準備画面 ----
const numOrNaN = (v) => (String(v).trim() === "" ? NaN : Number(v));

function readSettingsFromForm() {
  const s = app.setup.settings;
  s.target = numOrNaN($("target").value);
  s.resetValue = numOrNaN($("reset-value").value);
  s.missLimit = numOrNaN($("miss-limit").value);
}

function writeSettingsToForm() {
  const s = app.setup.settings;
  $("target").value = s.target;
  $("reset-value").value = Number.isInteger(s.resetValue) ? s.resetValue : "";
  $("miss-limit").value = s.missLimit;
  refreshSetup();
}

function ruleSummary(s) {
  const reset = L.resetPoint(s);
  const parts = [`${s.target}点ぴったりでゴール`, `こえたら${reset}点にもどる`];
  parts.push(s.missLimitEnabled
    ? `${s.missLimit}回つづけて0点でおしまい${s.faultCountsAsMiss ? "（フォルトもふくむ）" : ""}`
    : "0点がつづいても おしまいにならない");
  return parts.join(" ／ ");
}

// 入力のたびに、表示（半分の点数・切りかえ・確認文・エラー・開始ボタン）を整える
function refreshSetup() {
  const s = app.setup.settings;
  const half = Number.isInteger(s.target) ? Math.floor(s.target / 2) : "?";
  $("half-value").textContent = half;
  for (const b of document.querySelectorAll("[data-reset-mode]")) {
    b.setAttribute("aria-pressed", String(b.dataset.resetMode === s.resetMode));
  }
  $("reset-custom-field").hidden = s.resetMode !== "custom";
  $("miss-enabled").setAttribute("aria-checked", String(s.missLimitEnabled));
  $("miss-limit").disabled = !s.missLimitEnabled;
  $("fault-counts").setAttribute("aria-checked", String(s.faultCountsAsMiss));

  const errors = L.validateSetup(s, app.setup.players.length);
  $("rule-summary").textContent = errors.length && L.validateSetup(s, 2).length
    ? "ルールの数字を たしかめてください"
    : ruleSummary(s);
  $("setup-errors").replaceChildren(...errors.map((e) => h("li", null, e)));
  $("start-button").disabled = errors.length > 0;
}

function renderPlayers() {
  const list = app.setup.players;
  $("player-list").replaceChildren(...list.map((p, i) => h("li", { class: "player" },
    h("span", { class: "badge", "aria-hidden": "true" }, i + 1),
    h("input", {
      class: "name-input", type: "text", maxlength: "20", autocomplete: "off", value: p.name,
      placeholder: defaultName(i), "aria-label": `${i + 1}ばんめに投げる人の名前`,
      "data-key": p.key,
      oninput: (e) => { p.name = e.target.value; },
    }),
    h("button", {
      type: "button", class: "mini", "aria-label": `${i + 1}ばんめの人を上へ`, disabled: i === 0,
      onclick: () => movePlayer(i, -1),
    }, "▲"),
    h("button", {
      type: "button", class: "mini", "aria-label": `${i + 1}ばんめの人を下へ`, disabled: i === list.length - 1,
      onclick: () => movePlayer(i, 1),
    }, "▼"),
    h("button", {
      type: "button", class: "mini", "aria-label": `${i + 1}ばんめの人をけす`,
      disabled: list.length <= L.LIMITS.playersMin,
      onclick: () => { list.splice(i, 1); renderPlayers(); },
    }, "✕"),
  )));
  $("add-player").disabled = list.length >= L.LIMITS.playersMax;
  refreshSetup();
}

function movePlayer(i, d) {
  const list = app.setup.players;
  [list[i], list[i + d]] = [list[i + d], list[i]];
  renderPlayers();
  $("player-list").children[i + d].querySelectorAll("button")[d < 0 ? 0 : 1].focus();
}

function shufflePlayers() {
  const list = app.setup.players;
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  renderPlayers();
}

// 新しい試合を始める（はじめる・再戦・やりなおしで共通）。開始後はルールを変えられない
function beginGame(settings, names) {
  app.game = {
    version: L.VERSION,
    settings: { ...settings },
    players: names.map((name, i) => ({ id: `p${i + 1}`, name })),
    throws: [],
    startedAt: new Date().toISOString(),
  };
  app.padStep = "choose";
  saveGame();
  renderGame();
  showScreen("game");
}

function startGame() {
  readSettingsFromForm();
  const s = { ...app.setup.settings };
  if (L.validateSetup(s, app.setup.players.length).length) return;
  if (s.resetMode === "half") s.resetValue = L.resetPoint(s);
  // 次に開いたときの準備画面の初期値（空欄の名前は空欄のまま覚える）
  store.set(STORE_SETUP, { settings: s, names: app.setup.players.map((p) => p.name.trim()) });
  beginGame(s, app.setup.players.map((p, i) => p.name.trim() || defaultName(i)));
}

function initSetup() {
  const last = L.restoreSetup(store.get(STORE_SETUP));
  if (last) {
    app.setup.settings = last.settings;
    app.setup.players = last.names.map((n) => newPlayer(n));
  } else {
    app.setup.players = [newPlayer(), newPlayer()];
  }
  for (const id of ["target", "reset-value", "miss-limit"]) {
    $(id).addEventListener("input", () => { readSettingsFromForm(); refreshSetup(); });
  }
  for (const b of document.querySelectorAll("[data-reset-mode]")) {
    b.addEventListener("click", () => {
      const s = app.setup.settings;
      s.resetMode = b.dataset.resetMode;
      // 「自分で決める」に切りかえたとき、空なら今の半分の点数を入れておく
      if (s.resetMode === "custom" && !Number.isInteger(s.resetValue) && Number.isInteger(s.target)) {
        s.resetValue = Math.floor(s.target / 2);
        $("reset-value").value = s.resetValue;
      }
      refreshSetup();
    });
  }
  $("miss-enabled").addEventListener("click", () => {
    app.setup.settings.missLimitEnabled = !app.setup.settings.missLimitEnabled;
    refreshSetup();
  });
  $("fault-counts").addEventListener("click", () => {
    app.setup.settings.faultCountsAsMiss = !app.setup.settings.faultCountsAsMiss;
    refreshSetup();
  });
  $("reset-rules").addEventListener("click", () => {
    app.setup.settings = { ...L.DEFAULT_SETTINGS };
    writeSettingsToForm();
  });
  $("add-player").addEventListener("click", () => {
    app.setup.players.push(newPlayer());
    renderPlayers();
    const inputs = $("player-list").querySelectorAll("input");
    inputs[inputs.length - 1].focus();
  });
  $("shuffle-players").addEventListener("click", shufflePlayers);
  $("start-button").addEventListener("click", startGame);
  writeSettingsToForm();
  renderPlayers();
}

// ---- 試合画面 ----
function lastThrowLabel(entry) {
  if (!entry) return "";
  switch (entry.result) {
    case "ADD": return `+${entry.points}`;
    case "OVER": return "こえた↩︎";
    case "MISS": return entry.fault ? "フォルト" : "0点";
    case "FAULT": return "フォルト";
    case "OUT": return "おしまい";
    case "WIN": return "ゴール";
    default: return "";
  }
}

function missDots(p, s) {
  if (s.missLimitEnabled) {
    return h("span", { class: "dots", "aria-label": `0点 ${p.misses}回つづけて` },
      "●".repeat(Math.min(p.misses, s.missLimit)) + "○".repeat(Math.max(s.missLimit - p.misses, 0)));
  }
  return p.misses > 0 ? h("span", { class: "dots" }, `0点×${p.misses}`) : null;
}

function renderGame() {
  const game = app.game;
  const s = game.settings;
  const st = L.computeState(game);
  if (st.finished) {
    renderResult(st);
    showScreen("result");
    return;
  }
  const cur = st.players.find((p) => p.id === st.currentPlayerId);

  $("round").textContent = `${st.round}まわりめ`;
  $("who").textContent = `${cur.name} さんの番`;
  $("left").replaceChildren("あと ", h("b", null, cur.remaining), " 点でゴール");
  $("warn").hidden = !cur.atRisk;

  const lastOf = new Map();
  for (const e of st.history) lastOf.set(e.playerId, e);
  $("board").replaceChildren(...st.players.map((p) => {
    const now = p.id === st.currentPlayerId;
    return h("li", { class: `p-row${now ? " now" : ""}${p.out ? " out" : ""}`, "aria-current": now ? "true" : null },
      h("span", { class: "mark", "aria-hidden": "true" }, now ? "▶" : ""),
      h("div", null,
        h("div", { class: "nm" }, p.name),
        h("div", { class: "meta" },
          p.out ? h("span", { class: "tag" }, "おしまい") : `あと ${p.remaining}点`,
          p.out ? null : missDots(p, s)),
      ),
      h("div", { class: "score", "aria-label": `${p.score}点` }, p.score),
      h("div", { class: "last" }, lastThrowLabel(lastOf.get(p.id))),
    );
  }));
  const nowRow = $("board").querySelector(".now");
  if (nowRow) nowRow.scrollIntoView({ block: "nearest" });

  renderPad();
}

// 入力パッド（質問式）: ステップ1「どうだった？」→ ステップ2「番号」または「本数」
function renderPad() {
  const step = app.padStep;
  const go = (next) => () => { app.padStep = next; renderPad(); focusPad(); };
  let items;
  if (step === "one") {
    items = [
      h("div", { class: "step-head" },
        h("button", { type: "button", class: "back", onclick: go("choose") }, "← もどる"),
        "たおれたピンの番号は？"),
      ...Array.from({ length: 12 }, (_, i) => h("button", {
        type: "button", class: "pin", "aria-label": `${i + 1}番のピン（${i + 1}点）`,
        onclick: () => recordThrow(i + 1, false),
      }, i + 1)),
    ];
  } else if (step === "many") {
    items = [
      h("div", { class: "step-head" },
        h("button", { type: "button", class: "back", onclick: go("choose") }, "← もどる"),
        "たおれた本数は？"),
      ...Array.from({ length: 11 }, (_, i) => h("button", {
        type: "button", class: "count", "aria-label": `${i + 2}本（${i + 2}点）`,
        onclick: () => recordThrow(i + 2, false),
      }, h("b", null, i + 2), h("small", null, "本"))),
    ];
  } else {
    items = [
      h("div", { class: "pad-q" }, "どうだった？"),
      h("button", { type: "button", class: "choice one", onclick: go("one") }, "1本だけ", h("small", null, "たおれた")),
      h("button", { type: "button", class: "choice many", onclick: go("many") }, "2本以上", h("small", null, "たおれた")),
      h("button", { type: "button", class: "choice zero", onclick: () => recordThrow(0, false) }, "0点", h("small", null, "たおれなかった")),
      h("button", { type: "button", class: "choice fault", onclick: () => recordThrow(0, true) }, "フォルト", h("small", null, "ルールいはん")),
    ];
  }
  const noThrows = app.game.throws.length === 0;
  items.push(h("div", { class: "tools" },
    h("button", { type: "button", disabled: noThrows, onclick: undoThrow }, "↩︎ ひとつもどす"),
    h("button", { type: "button", onclick: openHistory }, "📋 きろく"),
    h("button", { type: "button", onclick: openMenu }, "☰ メニュー"),
  ));
  $("pad").replaceChildren(...items);
}

function focusPad() {
  const first = $("pad").querySelector("button:not([disabled])");
  if (first) first.focus({ preventScroll: true });
}

function recordThrow(points, fault) {
  const game = app.game;
  const before = L.computeState(game);
  if (before.finished) return;
  game.throws.push({ playerId: before.currentPlayerId, points, fault, at: new Date().toISOString() });
  saveGame();   // 1投ごとに自動保存（F-11）
  if (!wakeLock) keepAwake(true);   // 読み込み直後に断られていても、タップのときに取り直す
  app.padStep = "choose";
  const st = L.computeState(game);
  showToast(st.last, game);
  renderGame();
}

// ひとつもどす: 記録の末尾を1つ消して計算し直すだけ（勝ったあとでも戻せる）
function undoThrow() {
  const game = app.game;
  const removed = game.throws.pop();
  if (!removed) return;
  saveGame();
  app.padStep = "choose";
  const name = game.players.find((p) => p.id === removed.playerId).name;
  const what = removed.fault ? "フォルト" : `${removed.points}点`;
  renderGame();
  showScreen("game");
  flashToast(`ひとつ もどしたよ（${name} さんの ${what}）`, "");
}

function flashToast(text, kind) {
  const el = $("toast");
  el.textContent = text;
  el.className = `toast show ${kind}`;
  clearTimeout(app.toastTimer);
  app.toastTimer = setTimeout(() => { el.className = "toast"; }, 1200);
}

function showToast(entry, game) {
  const name = game.players.find((p) => p.id === entry.playerId).name;
  let text, kind = "";
  switch (entry.result) {
    case "ADD": text = `+${entry.points} → ${entry.after}点`; break;
    case "OVER": text = `こえちゃった！ ${entry.before + entry.points} → ${entry.after}点にもどるよ`; kind = "over"; break;
    case "MISS":
      text = `${entry.fault ? "フォルトで 0点" : "ざんねん、0点"}${entry.misses >= 2 ? `（${entry.misses}回つづけて）` : ""}`;
      kind = "miss"; break;
    case "FAULT": text = "フォルトで 0点"; kind = "miss"; break;
    case "OUT": text = `${name} さんは ここまで。おつかれさま！`; kind = "out"; break;
    default: return;   // WIN は結果画面で知らせる
  }
  flashToast(text, kind);
}

// ---- きろく（行＝まわり、列＝あそぶ人。各マスに「その投の点（合計）」） ----
function sheetCell(e) {
  if (!e) return h("td", null);
  const marks = {
    ADD: ["", `+${e.points}`],
    OVER: ["over", `+${e.points}↩︎`],
    MISS: e.fault ? ["fault", "F"] : ["miss", "●"],
    FAULT: ["fault", "F"],
    OUT: ["out", e.fault ? "F✕" : "●✕"],
    WIN: ["win", `★+${e.points}`],
  };
  const [cls, pt] = marks[e.result];
  return h("td", { class: cls || null }, h("span", { class: "pt" }, pt), h("span", { class: "sum" }, `(${e.after})`));
}

function openHistory() {
  const st = L.computeState(app.game);
  const body = $("history-body");
  if (st.history.length === 0) {
    body.replaceChildren(h("p", { class: "sheet-empty" }, "まだ きろくは ありません"));
  } else {
    const rounds = st.history[st.history.length - 1].round;
    const cell = new Map(st.history.map((e) => [`${e.round}:${e.playerId}`, e]));
    body.replaceChildren(
      h("table", { class: "score-sheet" },
        h("thead", null, h("tr", null,
          h("th", { scope: "col" }, "まわり"),
          ...st.players.map((p) => h("th", { scope: "col" }, p.name)))),
        h("tbody", null, ...Array.from({ length: rounds }, (_, i) => h("tr", null,
          h("th", { scope: "row" }, i + 1),
          ...st.players.map((p) => sheetCell(cell.get(`${i + 1}:${p.id}`)))))),
        h("tfoot", null, h("tr", null,
          h("th", { scope: "row" }, "合計"),
          ...st.players.map((p) => h("td", null, p.out ? "おしまい" : p.score)))),
      ),
      h("p", { class: "legend" },
        h("b", null, "+8"), " たおした点数 ／ ", h("b", null, "(33)"), " その時の合計", h("br"),
        h("b", null, "↩︎"), " こえて もどった ／ ", h("b", null, "●"), " 0点 ／ ", h("b", null, "F"), " フォルト ／ ",
        h("b", null, "✕"), " おしまい ／ ", h("b", null, "★"), " ゴール"),
    );
  }
  $("history-dialog").showModal();
  body.scrollTop = body.scrollHeight;   // 新しいまわりが見えるように
}

$("history-close").addEventListener("click", () => $("history-dialog").close());

// ---- 結果画面 ----
function renderResult(st) {
  for (const b of document.querySelectorAll("[data-rematch-order]")) {
    b.setAttribute("aria-pressed", String(b.dataset.rematchOrder === app.rematchOrder));
  }
  const s = app.game.settings;
  const winner = st.players.find((p) => p.id === st.winnerId);
  const byGoal = st.last && st.last.result === "WIN";
  $("goal-title").textContent = byGoal ? "ゴール！" : "やったね！";
  $("winner").textContent = winner ? `${winner.name} さん` : "";
  $("goal-msg").textContent = byGoal
    ? `おめでとう！ ${st.round}まわりめで ${s.target}点ぴったり`
    : "さいごまで のこったので かち！ おめでとう！";
  $("ranking").replaceChildren(...L.ranking(st).map((r) => h("li", { class: `rank${r.winner ? " first" : ""}${r.out ? " out" : ""}` },
    h("span", { class: "pos" }, r.winner ? "🥇" : r.rank ?? "—"),
    h("span", { class: "rn" }, r.out ? `${r.name}（おしまい）` : r.name),
    h("span", { class: "sc" }, r.score),
  )));
}

// 再戦: 同じメンバー・同じルールで、投げる順だけ選んで始め直す
function rematch() {
  const prev = app.game;
  const st = L.computeState(prev);
  const order = L.rematchOrder(prev.players, st.winnerId, app.rematchOrder);
  beginGame(prev.settings, order.map((p) => p.name));
}

function backToSetup() {
  clearGame();
  app.game = null;
  showScreen("setup");
}

// ---- 確認ダイアログ（F-13）。「やめておく」・Esc・外側タップは false ----
function askConfirm(message, note, okLabel) {
  const dlg = $("confirm-dialog");
  $("confirm-message").replaceChildren(message, h("small", null, note));
  $("confirm-ok").textContent = okLabel;
  dlg.returnValue = "";
  dlg.showModal();
  $("confirm-cancel").focus();   // うっかり決定しないよう「やめておく」を選んだ状態にする
  return new Promise((resolve) => {
    dlg.addEventListener("close", () => resolve(dlg.returnValue === "ok"), { once: true });
  });
}
$("confirm-ok").addEventListener("click", () => $("confirm-dialog").close("ok"));
$("confirm-cancel").addEventListener("click", () => $("confirm-dialog").close("cancel"));

// ---- メニュー（試合中） ----
function openMenu() {
  $("menu-rule").textContent = ruleSummary(app.game.settings);
  $("menu-dialog").showModal();
}

$("menu-close").addEventListener("click", () => $("menu-dialog").close());

$("menu-restart").addEventListener("click", async () => {
  $("menu-dialog").close();
  const ok = await askConfirm("同じメンバーで、0点から やりなおしますか？", "いままでの点数は きえます。", "やりなおす");
  if (ok) beginGame(app.game.settings, app.game.players.map((p) => p.name));
});

$("menu-quit").addEventListener("click", async () => {
  $("menu-dialog").close();
  const ok = await askConfirm("いまの試合を やめて、はじめの画面に もどりますか？", "この試合の きろくは のこりません。", "やめる");
  if (ok) backToSetup();
});

// ダイアログの外側（暗いところ）をタップしたら閉じる
for (const id of ["menu-dialog", "confirm-dialog", "history-dialog"]) {
  $(id).addEventListener("click", (e) => {
    if (e.target !== e.currentTarget) return;
    const r = e.currentTarget.getBoundingClientRect();
    const outside = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
    if (outside) e.currentTarget.close("cancel");
  });
}

for (const b of document.querySelectorAll("[data-rematch-order]")) {
  b.addEventListener("click", () => {
    app.rematchOrder = b.dataset.rematchOrder;
    renderResult(L.computeState(app.game));
  });
}
$("rematch").addEventListener("click", rematch);
$("result-undo").addEventListener("click", undoThrow);
$("result-history").addEventListener("click", openHistory);
$("back-to-setup").addEventListener("click", backToSetup);

// ---- 起動 ----
initSetup();

// 途中の試合が保存されていれば、つづきから（T-13）。壊れたデータは捨てて準備画面へ
const savedGame = L.restoreGame(store.get(STORE_GAME));
if (savedGame) {
  app.game = savedGame;
  renderGame();   // 終わっていた試合なら結果画面を出す
  if (!L.computeState(savedGame).finished) {
    showScreen("game");
    flashToast("つづきから はじめます", "");
  }
} else {
  clearGame();
}
</script>
</body>
</html>
